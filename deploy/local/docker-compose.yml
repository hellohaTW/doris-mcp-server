# Local single-service Compose file for the Doris MCP Server.
#
# The root docker-compose.yml describes a full stack (Doris, Redis, Prometheus,
# Grafana, Nginx). This file runs only the MCP Server against a Doris cluster
# you already have, and optionally starts a throwaway Doris under the `doris`
# profile. See README.md in this directory before starting it.

name: doris-mcp-local

services:
  # Doris MCP Server, Streamable HTTP on loopback only.
  doris-mcp-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: doris-mcp-server:local
    container_name: doris-mcp-server-local
    ports:
      # Published on 127.0.0.1 only. The container binds 0.0.0.0 internally,
      # so token authentication below is what protects the endpoint.
      - target: 3000
        published: "${MCP_HTTP_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      # Doris route. host.docker.internal resolves to the Docker host through
      # the extra_hosts entry below; use `doris-fe` with the `doris` profile.
      - DORIS_HOST=${DORIS_HOST:-host.docker.internal}
      - DORIS_PORT=${DORIS_PORT:-9030}
      - DORIS_USER=${DORIS_USER:-mcp_reader}
      - DORIS_PASSWORD_FILE=/run/secrets/doris_password
      - DORIS_DATABASE=${DORIS_DATABASE:-information_schema}
      - DORIS_FE_HTTP_PORT=${DORIS_FE_HTTP_PORT:-8030}
      - DORIS_BE_WEBSERVER_PORT=${DORIS_BE_WEBSERVER_PORT:-8040}

      # Connection pool, kept small for a local machine.
      - DORIS_MIN_CONNECTIONS=${DORIS_MIN_CONNECTIONS:-2}
      - DORIS_MAX_CONNECTIONS=${DORIS_MAX_CONNECTIONS:-10}

      # HTTP listener. SERVER_HOST must be 0.0.0.0 so the published port
      # reaches the process inside the container.
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - WORKERS=1

      # The bind host is not a deployment hostname, so the Host/Origin
      # allowlists have to be explicit or every request is rejected.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*}

      # A non-loopback bind refuses to start unauthenticated, so a static
      # bearer token is required. Generate it into ./secrets/mcp_static_token.
      - ENABLE_TOKEN_AUTH=true
      - TOKEN_ADMIN_FILE=/run/secrets/mcp_static_token
      - TOKEN_ADMIN_DESCRIPTION=Local development token

      # Opt-in adapter for handshake-era Hosts such as Dify 1.16.1.
      - ENABLE_LEGACY_HTTP_ADAPTER=${ENABLE_LEGACY_HTTP_ADAPTER:-false}

      # Result and execution bounds.
      - MAX_RESULT_ROWS=${MAX_RESULT_ROWS:-10000}
      - DEFAULT_RESULT_ROWS=${DEFAULT_RESULT_ROWS:-100}
      - MAX_RESULT_BYTES=${MAX_RESULT_BYTES:-1048576}
      - QUERY_TIMEOUT=${QUERY_TIMEOUT:-300}
      - MAX_CONCURRENT_QUERIES=${MAX_CONCURRENT_QUERIES:-20}

      # Logs go to stdout so `docker compose logs` is the single source.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets:
      - doris_password
      - mcp_static_token
    extra_hosts:
      # Lets the container reach a Doris running on the Docker host. Docker
      # Desktop provides this name already; this entry adds it on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # /ready is Doris-backed: unhealthy here means the Doris route is broken,
      # not that the process died. Use /live to check the process alone.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional throwaway Doris for machines without a cluster. Started only with
  # `docker compose --profile doris up -d`. Not a production topology.
  doris-fe:
    profiles: ["doris"]
    image: apache/doris:fe-3.0.8@sha256:749afa2be75cd58d54a0bdb3edaa805d5974646f67500f094912f8dbc4a96b8f
    container_name: doris-fe-local
    ports:
      - target: 8030
        published: "${DORIS_FE_HTTP_PUBLISHED_PORT:-8030}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9030
        published: "${DORIS_FE_QUERY_PUBLISHED_PORT:-9030}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - FE_ID=1
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    secrets:
      - source: doris_password
        target: /etc/basic_auth/password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  doris-be:
    profiles: ["doris"]
    image: apache/doris:be-3.0.8@sha256:a337e2b17a65c86c22a1205467a825d46dc3380c94ba8024e53eea033641f12e
    container_name: doris-be-local
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be:9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    secrets:
      - source: doris_password
        target: /etc/basic_auth/password
    depends_on:
      doris-fe:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:

secrets:
  # One non-empty line each, no trailing newline requirements beyond that.
  doris_password:
    file: ${LOCAL_DORIS_PASSWORD_FILE:-./secrets/doris_password}
  mcp_static_token:
    file: ${LOCAL_MCP_STATIC_TOKEN_FILE:-./secrets/mcp_static_token}
